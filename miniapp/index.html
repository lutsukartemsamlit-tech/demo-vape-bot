<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Demo_bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=6" />
  <style>
    .loading-indicator {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(10, 14, 39, 0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      color: #eee;
      font-size: 16px;
    }
    .spinner {
      border: 4px solid rgba(102, 126, 234, 0.2);
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 48px; height: 48px;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-message { text-align: center; padding: 40px 20px; color: #eee; }
    .error-icon { font-size: 56px; margin-bottom: 16px; }
    .retry-btn {
      margin-top: 16px;
      padding: 12px 28px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    /* Миниатюра в списке товаров */
    .product-thumb {
      width: 72px;
      height: 72px;
      min-width: 72px;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(102, 126, 234, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .product-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Картинка на странице товара */
    .detail-image {
      width: 100%;
      border-radius: 16px;
      margin-bottom: 20px;
      background: rgba(30, 35, 60, 0.6);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }
    .detail-image img {
      width: 100%;
      height: auto;
      max-height: 500px;
      object-fit: contain;
      display: block;
    }

    /* Toast — скрыт по умолчанию */
    .toast {
      position: fixed;
      bottom: calc(70px + 20px);
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 10000;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <!-- ЭКРАН: Главная -->
  <div id="screen-home" class="screen active">
    <div class="hero">
      <div class="hero-content">
        <div class="hero-logo">💨</div>
        <h1>Demo_bot</h1>
        <p>Вейп-продукция с доставкой по Самаре</p>
      </div>
    </div>
    <div class="categories-grid" id="categories-grid"></div>
    <div class="footer">@demo_vape_bot</div>
  </div>

  <!-- ЭКРАН: Список товаров категории -->
  <div id="screen-products" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="goBack()">&#8592;</button>
      <h2 id="category-title">Категория</h2>
    </div>
    <div class="products-list" id="products-list"></div>
  </div>

  <!-- ЭКРАН: Дочерние продукты (линейки) -->
  <div id="screen-subproducts" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="goBack()">&#8592;</button>
      <h2 id="parent-title">Линейки</h2>
    </div>
    <div class="products-list" id="subproducts-list"></div>
  </div>

  <!-- ЭКРАН: Карточка товара -->
  <div id="screen-detail" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="goBack()">&#8592;</button>
      <h2 id="detail-title">Товар</h2>
    </div>
    <div id="detail-content"></div>
  </div>

  <!-- ЭКРАН: Корзина -->
  <div id="screen-cart" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="goBack()">&#8592;</button>
      <h2>🛒 Корзина</h2>
    </div>
    <div id="cart-content"></div>
  </div>

  <!-- ЭКРАН: Оформление заказа -->
  <div id="screen-checkout" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="showCart()">&#8592;</button>
      <h2>📦 Оформление</h2>
    </div>
    <div id="checkout-content"></div>
  </div>

  <!-- ЭКРАН: Админ-панель -->
  <div id="screen-admin" class="screen">
    <div class="screen-header">
      <h2>⚙️ Админ-панель</h2>
    </div>
    <div id="admin-content">
      <!-- Главное меню админа -->
      <div id="admin-main">
        <div class="categories-grid" id="admin-categories"></div>
      </div>
      
      <!-- Товары категории -->
      <div id="admin-products" style="display: none;">
        <div class="screen-header" style="padding: 0;">
          <button class="back-btn" onclick="showAdminMain()">&#8592;</button>
          <h2 id="admin-category-title"></h2>
        </div>
        <div class="products-list" id="admin-products-list"></div>
      </div>
      
      <!-- Управление вкусами -->
      <div id="admin-flavors" style="display: none;">
        <div class="screen-header" style="padding: 0;">
          <button class="back-btn" onclick="goBackAdmin()">&#8592;</button>
          <h2 id="admin-product-title"></h2>
        </div>
        <div id="admin-flavors-content"></div>
      </div>
    </div>
  </div>

  <!-- Нижняя навигация -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="showHome()" title="Главная">
      <span class="nav-icon">🏠</span>
    </button>
    <button class="nav-btn cart-nav-btn" onclick="showCart()" title="Корзина">
      <span class="nav-icon">🛒</span>
      <span class="cart-badge" id="cart-badge" style="display:none">0</span>
    </button>
    <button class="nav-btn" id="admin-nav-btn" onclick="showAdminScreen()" title="Админ">
      <span class="nav-icon">⚙️</span>
    </button>
  </nav>

  <script src="app.js?v=4"></script>
</body>
</html>
